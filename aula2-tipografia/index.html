<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Css bootstrap-->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Tipografia</title>
</head>

<body>
    <h1 class="h1">Hello, world!</h1> <!-- h1 título normal -->

    <p class="display-1">Hello, world 2.0</p>
    <!-- display: um título que pode ficar muito grande na tela, maior que o h1 -->

    <p>Eu amo <mark>Jesus</mark></p>
    <!--<mark> é um dos efeitos de texto (esse esta marcando o nome de Deus), existem outros  -->

    <blockquote class="blockquote">
        <p class="mb-0">Só sei que nada sei</p>
        <footer class="blockquote-footer">Ana Gabriela <cite title="Source Title">Não sei nada</cite></footer>
    </blockquote> <!-- Esse fica efeito poesia-->







    <!-- Script bootstrap (o script sempre tem que ficar no final da pag antes do fechamento do body)-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
